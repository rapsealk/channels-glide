[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "channels-glide"
version = "0.1.0"
description = "Django Channels channel layer backed by Valkey GLIDE"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "rapsealk" }]
keywords = ["django", "channels", "valkey", "glide", "websocket", "asgi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "channels>=4.2",
    "valkey-glide>=2.5",
    "msgpack>=1.0",
]

[project.urls]
Homepage = "https://github.com/rapsealk/channels-glide"
Issues = "https://github.com/rapsealk/channels-glide/issues"
Source = "https://github.com/rapsealk/channels-glide"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["channels_glide"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
# channels itself ships no py.typed; subclassing its (Any) BaseChannelLayer is
# the point of this package.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "channels.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "msgpack.*"
ignore_missing_imports = true
